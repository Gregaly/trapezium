name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The packages are built first because the adapters resolve the core
      # through its published entry points, exactly as a consumer does.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # The packages are only as good as they are once packed: an exports map
      # that resolves in the repo and not on npm is the classic way to ship a
      # broken release.
      - run: pnpm check:packaging

      # An example that no longer builds is a broken release, not a broken
      # example — they are the only proof the published entry points work in a
      # real app.
      - run: pnpm build:examples
